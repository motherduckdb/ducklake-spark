name: Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - scala: "2.12"
            scala_full: "2.12.18"
          - scala: "2.13"
            scala_full: "2.13.18"
    name: test (Scala ${{ matrix.scala }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Run tests
        run: >
          mvn -B
          -Dscala.binary.version=${{ matrix.scala }}
          -Dscala.version=${{ matrix.scala_full }}
          test
