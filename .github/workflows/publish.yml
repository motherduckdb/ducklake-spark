name: Publish to Maven Central

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # One deployment per Scala binary version: the artifacts have different names
    # (ducklake-spark_2.12, ducklake-spark_2.13) and are published independently.
    strategy:
      fail-fast: false
      matrix:
        include:
          - scala: "2.12"
            scala_full: "2.12.18"
          - scala: "2.13"
            scala_full: "2.13.18"
    name: publish (Scala ${{ matrix.scala }})
    steps:
      - uses: actions/checkout@v4

      - name: Derive version from tag
        id: version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          if [[ "$VERSION" == *SNAPSHOT* ]]; then
            echo "::error::Refusing to publish SNAPSHOT version: $VERSION"
            exit 1
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].+)?$ ]]; then
            echo "::error::'$VERSION' does not look like a release version (expected MAJOR.MINOR.PATCH)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing version: $VERSION"

      - name: Set up Java + Maven settings + GPG
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Set pom version
        run: mvn -B versions:set -DnewVersion=${{ steps.version.outputs.version }} -DgenerateBackupPoms=false

      - name: Build, sign, and deploy
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: >
          mvn -B -P release -DskipTests
          -Dscala.binary.version=${{ matrix.scala }}
          -Dscala.version=${{ matrix.scala_full }}
          -Dgpg.passphrase="$GPG_PASSPHRASE"
          deploy
